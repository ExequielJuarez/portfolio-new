# Velta Web: nginx (HTTPS) para veltaweb.com.ar. Se copia a /etc/nginx/conf.d/velta.conf
# Requiere el certificado ya emitido con certbot (/etc/letsencrypt/live/veltaweb.com.ar/).
# Aplicar con: ./deploy/aplicar-nginx.sh

server_tokens off;

# Límites por IP (anti abuso / DoS de capa 7 básico)
limit_req_zone  $binary_remote_addr zone=velta_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=velta_conn:10m;

# --- HTTP: solo redirige a HTTPS (y deja pasar la validación de certbot) ---
server {
    listen 80;
    listen [::]:80;
    server_name veltaweb.com.ar www.veltaweb.com.ar;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://veltaweb.com.ar$request_uri; }
}

# --- www -> sin www (una sola dirección canónica) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.veltaweb.com.ar;

    ssl_certificate     /etc/letsencrypt/live/veltaweb.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veltaweb.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://veltaweb.com.ar$request_uri;
}

# --- Sitio principal ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veltaweb.com.ar;

    ssl_certificate     /etc/letsencrypt/live/veltaweb.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veltaweb.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/velta;
    index index.html;

    # --- Límites y timeouts (corta conexiones lentas tipo slowloris) ---
    limit_req          zone=velta_req burst=120 nodelay;
    limit_req_status   429;
    limit_conn         velta_conn 40;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     15s;
    client_max_body_size  1k;
    large_client_header_buffers 4 8k;

    # Solo lectura
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # Nunca servir archivos ocultos (.git, .env, etc.)
    location ~ /\. { return 404; }

    # --- Solo se publica lo de esta lista; todo lo demás da 404 ---
    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/velta-headers.conf;
        include /etc/nginx/snippets/velta-page.conf;
    }
    location = /index.html { return 301 /; }

    # Páginas de servicio: /slug redirige a /slug/ (URL única para buscadores)
    location ~ ^/(paginas-web-santiago-del-estero|tiendas-online-ecommerce|landing-pages|sistemas-a-medida)$ { return 301 /$1/; }
    location ~ ^/(paginas-web-santiago-del-estero|tiendas-online-ecommerce|landing-pages|sistemas-a-medida)/$ {
        try_files /$1/index.html =404;
        include /etc/nginx/snippets/velta-headers.conf;
        include /etc/nginx/snippets/velta-page.conf;
    }

    location /css/    { include /etc/nginx/snippets/velta-headers.conf; add_header Cache-Control "no-cache" always; }
    location /js/     { include /etc/nginx/snippets/velta-headers.conf; add_header Cache-Control "no-cache" always; }
    location /assets/ { include /etc/nginx/snippets/velta-headers.conf; add_header Cache-Control "public, max-age=86400" always; }

    # Demos: solo se pueden enmarcar desde este sitio, sin formularios; no se indexan en buscadores
    location /demos/ {
        include /etc/nginx/snippets/velta-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt  { try_files /robots.txt =404;  access_log off; add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap.xml { try_files /sitemap.xml =404; access_log off; default_type application/xml; add_header Cache-Control "public, max-age=3600" always; }
    location = /favicon.ico { return 301 /assets/favicon.png; }

    # Cualquier otra ruta (src/, package.json, deploy/, etc.)
    location / { return 404; }
}
