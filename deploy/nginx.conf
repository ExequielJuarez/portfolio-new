# Velta Web: nginx para sitio estático. Copiar a /etc/nginx/conf.d/velta.conf
# Reemplazar TU-DOMINIO.com y, luego: certbot --nginx -d TU-DOMINIO.com -d www.TU-DOMINIO.com
# Probar con: nginx -t && systemctl reload nginx

server_tokens off;

# Límites por IP (anti abuso / DoS de capa 7 básico)
limit_req_zone  $binary_remote_addr zone=velta_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=velta_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com www.TU-DOMINIO.com;

    root /var/www/velta;
    index index.html;

    # --- Límites y timeouts (corta conexiones lentas tipo slowloris) ---
    limit_req          zone=velta_req burst=120 nodelay;
    limit_req_status   429;
    limit_conn         velta_conn 40;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     15s;
    client_max_body_size  1k;                 # el sitio no recibe datos
    large_client_header_buffers 4 8k;

    # Solo lectura
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # --- Nunca servir archivos ocultos (.git, .env, etc.) ---
    location ~ /\. { return 404; }

    # --- Solo se publica lo de esta lista; todo lo demás da 404 ---
    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/velta-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/velta-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
    }
    location /css/    { include /etc/nginx/snippets/velta-headers.conf; add_header Cache-Control "public, max-age=3600" always; }
    location /js/     { include /etc/nginx/snippets/velta-headers.conf; add_header Cache-Control "public, max-age=3600" always; }
    location /assets/ { include /etc/nginx/snippets/velta-headers.conf; add_header Cache-Control "public, max-age=604800" always; }

    # Demos: solo se pueden enmarcar desde este mismo sitio, sin formularios ni conexiones externas
    location /demos/ {
        include /etc/nginx/snippets/velta-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # robots.txt / favicon opcionales
    location = /robots.txt { try_files /robots.txt =404; log_not_found off; access_log off; }

    # Cualquier otra ruta (src/, package.json, deploy/, etc.)
    location / { return 404; }
}
