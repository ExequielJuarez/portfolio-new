/* Demo estática: sin conexión en vivo y con horas relativas al momento de la visita */
(function(){var CAP=1792372144708,shift=Date.now()-CAP;
window.EventSource=function(){return {close:function(){},addEventListener:function(){},onmessage:null,onerror:null}};
var f=window.fetch;window.fetch=function(u,i){var m=((i&&i.method)||'GET').toUpperCase();
 if(m!=='GET')return f.apply(this,arguments);
 return f.apply(this,arguments).then(function(r){return r.text().then(function(t){
