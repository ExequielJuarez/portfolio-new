window.EventSource=function(){return {close:function(){},addEventListener:function(){},onmessage:null,onerror:null}};var f=window.fetch;window.fetch=function(u,i){var m=((i&&i.method)||(u&&u.method)||'GET').toUpperCase();if(m==='GET')return f.apply(this,arguments);toast();return Promise.reject(new Error('demo'))};

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar mesa · JB Sushi</title>
  <meta name="description" content="JB Sushi: sushi, buena compañía y el ambiente ideal. Mirá el menú y reservá tu mesa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-interna">

<header class="cabecera" id="cabecera">
  <a href="index.html" class="logo" aria-label="JB Sushi, inicio">
    <span class="logo__marca">JB</span>
    <span class="logo__texto">Sushi</span>
  </a>

  <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="navegacion">
    <span></span><span></span><span></span>
  </button>

  <nav class="nav" id="navegacion">
    <ul class="nav__lista">
      
        <li><a href="index.html" class="nav__link ">Inicio</a></li>
      
        <li><a href="menu.html" class="nav__link ">Menú</a></li>
      
        <li><a href="nosotros.html" class="nav__link ">Nosotros</a></li>
      
        <li><a href="contacto.html" class="nav__link ">Contacto</a></li>
      
    </ul>
    <a href="reservar.html" class="boton boton--redondo nav__reservar">Reservar</a>
  </nav>
</header>
<main>



<section class="encabezado">
  <p class="etiqueta">Reservas</p>
  <h1 class="titulo">Reservá tu mesa</h1>
</section>

<section class="reservar">
  
    <form class="form" id="formReserva" method="post" action="reservar.html" novalidate>
      
      <div class="form__fila form__fila--2">
        <label class="campo">Nombre
          <input type="text" name="nombre" autocomplete="name" required value="">
          <em class="campo__error" data-error="nombre"></em>
        </label>
        <label class="campo">Teléfono
          <input type="tel" name="telefono" autocomplete="tel" required value="">
          <em class="campo__error" data-error="telefono"></em>
        </label>
      </div>
      <label class="campo">Email <small>(opcional)</small>
        <input type="email" name="email" autocomplete="email" value="">
        <em class="campo__error" data-error="email"></em>
      </label>
      <div class="form__fila form__fila--3">
        <label class="campo">Fecha
          <input type="date" name="fecha" min="2026-10-18" required value="">
          <em class="campo__error" data-error="fecha"></em>
        </label>
        <label class="campo">Horario
          <select name="hora" required>
            <option value="">Elegí…</option>
            
              <option value="20:00" >20:00 hs</option>
            
              <option value="20:30" >20:30 hs</option>
            
              <option value="21:00" >21:00 hs</option>
            
              <option value="21:30" >21:30 hs</option>
            
              <option value="22:00" >22:00 hs</option>
            
              <option value="22:30" >22:30 hs</option>
            
              <option value="23:00" >23:00 hs</option>
            
              <option value="23:30" >23:30 hs</option>
            
          </select>
          <em class="campo__error" data-error="hora"></em>
        </label>
        <label class="campo">Personas
          <select name="personas" required>
            
              <option value="1" >1</option>
            
              <option value="2" selected>2</option>
            
              <option value="3" >3</option>
            
              <option value="4" >4</option>
            
              <option value="5" >5</option>
            
              <option value="6" >6</option>
            
              <option value="7" >7</option>
            
              <option value="8" >8</option>
            
              <option value="9" >9</option>
            
              <option value="10" >10</option>
            
              <option value="11" >11</option>
            
              <option value="12" >12</option>
            
          </select>
          <em class="campo__error" data-error="personas"></em>
        </label>
      </div>
      <label class="campo">Comentarios <small>(opcional)</small>
        <textarea name="comentarios" rows="3" maxlength="300" placeholder="Cumpleaños, alergias, mesa preferida…"></textarea>
        <em class="campo__error" data-error="comentarios"></em>
      </label>
      <button type="submit" class="boton">Confirmar reserva <span aria-hidden="true">→</span></button>
      <p class="form__aviso" id="formAviso" role="alert"></p>
    </form>
  
</section>

</main>
<footer class="pie">
  <div class="pie__marca">
    <span class="logo__marca">JB</span>
    <span class="logo__texto">Sushi</span>
  </div>
  <p class="pie__texto">Cenas · Martes a domingo · 20:00 a 00:00</p>
  <ul class="pie__enlaces">
    <li><a href="menu.html">Menú</a></li>
    <li><a href="reservar.html">Reservar</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <p class="pie__copy">© 2026 JB Sushi</p>
</footer>
<script src="js/principal.js"></script>

</body>
</html>
